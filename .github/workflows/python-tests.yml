name: Python Tests
on:
  push:
    branches: [main, 'feature/python-final-ui-cloud']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install UI and portal requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ui.txt -r cloud/requirements.txt
      - name: Check syntax
        run: python -m compileall -q main.py letterstars cloud tests
      - name: Run unit and headless rendering tests
        run: python -m unittest discover -s tests -v
