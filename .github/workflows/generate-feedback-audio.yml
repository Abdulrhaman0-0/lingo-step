name: Generate gentle Arabic feedback audio
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_child_feedback.py'
      - '.github/workflows/generate-feedback-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generate-child-feedback
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generator
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'edge-tts>=7,<9'
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate the three exact existing feedback phrases
        run: python scripts/generate_child_feedback.py --voice ar-EG-SalmaNeural --rate=-13% --pitch=+9Hz
      - name: Check WAV files and unchanged feedback text
        run: |
          python - <<'PY'
          import wave
          from pathlib import Path
          from letterstars.services.feedback import PHRASES
          assert PHRASES == {
              "correct": "ممتاز",
              "retry": "حاول مرة أخرى",
              "retry_again": "خطأ، حاول مرة أخرى"
          }
          for key in PHRASES:
              path = Path("assets/audio") / (key + ".wav")
              with wave.open(str(path), "rb") as f:
                  assert f.getframerate() == 22050, path
                  assert f.getnchannels() == 1, path
                  assert f.getnframes() > 5000, path
                  assert f.getsampwidth() == 2, path
          print("All three WAV assets validated")
          PY
      - name: Commit audio assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/correct.wav assets/audio/retry.wav assets/audio/retry_again.wav
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "audio: regenerate gentle Egyptian female feedback recordings"
            git push origin HEAD:main
          fi
